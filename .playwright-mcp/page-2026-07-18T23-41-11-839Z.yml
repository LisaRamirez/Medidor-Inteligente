    - generic [ref=f81e18]: 10 Años de Historia
    - heading "Un Decada Transformando Comunidades" [level=1] [ref=f81e20]: Un Decada TransformandoComunidades
    - heading "Hace 10 años instalamos el primer medidor inteligente en APR Los Maquis. Hoy, mas de 200 comunidades en Chile confian en nosotros." [level=2] [ref=f81e22]: Hace 10 años instalamos el primer medidor inteligente en APR Los Maquis.Hoy, mas de 200 comunidades en Chile confian en nosotros.
  - generic [ref=f81e28]:
    - generic [ref=f81e29]: Empresa chilena
    - heading "¿Quiénes Somos?" [level=3] [ref=f81e30]
    - paragraph [ref=f81e32]: Somos una empresa chilena comprometida con revolucionar la gestion del agua potable en comunidades rurales. Nos especializamos en brindar soluciones tecnologicas avanzadas para las APR, ayudandoles a optimizar la distribucion, consumo y monitoreo del agua con la precision y accesibilidad que necesitan.
    - paragraph [ref=f81e33]: Con una vision centrada en la sostenibilidad y el desarrollo comunitario, disenamos productos que no solo facilitan el manejo eficiente del recurso hidrico, sino que tambien garantizan durabilidad, bajo costo operativo y soporte continuo.
    - paragraph [ref=f81e34]:
      - text: Hoy, mas de
      - strong [ref=f81e35]: 200 comunidades
      - text: en Chile confian en nuestra experiencia para modernizar sus sistemas y asegurar un futuro sostenible para su recurso mas esencial.
