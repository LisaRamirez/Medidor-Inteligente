    - generic [ref=f99e199]:
      - generic [ref=f99e200]:
        - generic [ref=f99e201]:
          - generic [ref=f99e202]: "1"
          - paragraph [ref=f99e203]: ¿Por qué las lecturas digital y análoga no coinciden?
        - generic [ref=f99e204]:
          - generic [ref=f99e205]: Respuesta
          - generic [ref=f99e206]:
            - paragraph [ref=f99e207]: El medidor fue instalado de forma invertida. Se debe revisar y corregir su posición.
            - generic [ref=f99e208]:
              - strong [ref=f99e209]: Facturación
              - text: Cuando la lectura digital es menor que la análoga, para efectos de facturación prevalece la lectura del medidor análogo.
      - generic [ref=f99e210]:
        - generic [ref=f99e211]:
          - generic [ref=f99e212]: "2"
          - paragraph [ref=f99e213]: ¿Si los medidores estuvieron guardados 2 años, pueden presentar fallas?
        - generic [ref=f99e214]:
          - generic [ref=f99e215]: Respuesta
          - generic [ref=f99e216]:
            - paragraph [ref=f99e217]: En general, no deberían presentar fallas. El único componente afectado podría ser el reloj digital por el estado de la batería.
            - generic [ref=f99e218]:
              - strong [ref=f99e219]: Solución
              - text: Retire la batería y vuelva a instalarla. Si el problema persiste, reemplácela.
      - generic [ref=f99e220]:
        - generic [ref=f99e221]:
          - generic [ref=f99e222]: "3"
          - paragraph [ref=f99e223]: ¿Qué se puede hacer con los medidores que se dan de baja?
        - generic [ref=f99e224]:
          - generic [ref=f99e225]: Respuesta
          - generic [ref=f99e226]:
            - paragraph [ref=f99e227]: "Primero evalúe la razón de la baja:"
            - list [ref=f99e228]:
              - listitem [ref=f99e229]: › Si es solo la batería, puede reemplazarse y reutilizarse.
              - listitem [ref=f99e230]: › Si hay daño irreversible, retírelo definitivamente.
            - generic [ref=f99e231]:
              - strong [ref=f99e232]: Soporte técnico
              - text: Contacte al soporte para orientación personalizada.
      - generic [ref=f99e233]:
        - generic [ref=f99e234]:
          - generic [ref=f99e235]: "4"
          - paragraph [ref=f99e236]: ¿El medidor se cerró y muestra E-8 en pantalla, cómo lo soluciono?
        - generic [ref=f99e237]:
          - generic [ref=f99e238]: Respuesta
          - generic [ref=f99e240]:
            - strong [ref=f99e241]: Procedimiento
            - text: Abra y cierre nuevamente la válvula del medidor para restablecer su funcionamiento normal.
      - generic [ref=f99e242]:
        - generic [ref=f99e243]:
          - generic [ref=f99e244]: "5"
          - paragraph [ref=f99e245]: ¿El medidor se cierra solo, qué debo hacer?
        - generic [ref=f99e246]:
          - generic [ref=f99e247]: Respuesta
          - generic [ref=f99e249]:
            - strong [ref=f99e250]: Recomendación
            - text: Traslade el medidor a otra ubicación. Un factor externo podría estar provocando el cierre automático.
      - generic [ref=f99e251]:
        - generic [ref=f99e252]:
          - generic [ref=f99e253]: "6"
          - paragraph [ref=f99e254]: ¿El medidor muestra E-6 en pantalla digital, qué significa?
        - generic [ref=f99e255]:
          - generic [ref=f99e256]: Respuesta
          - generic [ref=f99e257]:
            - paragraph [ref=f99e258]: El código E-6 indica que el medidor fue intervenido con un imán.
            - generic [ref=f99e259]:
              - strong [ref=f99e260]: Advertencia
              - text: Según la potencia del imán, puede haber daño mayor al sistema. El costo de reparación lo asume el cliente.
      - generic [ref=f99e261]:
        - generic [ref=f99e262]:
          - generic [ref=f99e263]: "7"
          - paragraph [ref=f99e264]: ¿Cómo borro el código E-6 de la pantalla digital?
        - generic [ref=f99e265]:
          - generic [ref=f99e266]: Respuesta
          - generic [ref=f99e268]:
            - strong [ref=f99e269]: Procedimiento
            - text: Reinicie el medidor desconectando y volviendo a conectar la batería. Si el daño fue mayor, puede requerirse reemplazo, cuyo costo asume el cliente.
      - generic [ref=f99e270]:
        - generic [ref=f99e271]:
          - generic [ref=f99e272]: "8"
          - paragraph [ref=f99e273]: Instalé un medidor nuevo y el display digital no avanza, ¿qué hago?
        - generic [ref=f99e274]:
          - generic [ref=f99e275]: Respuesta
          - generic [ref=f99e277]:
            - strong [ref=f99e278]: Solución
            - text: Reinicie el equipo desconectando y volviendo a conectar la batería.
      - generic [ref=f99e279]:
        - generic [ref=f99e280]:
          - generic [ref=f99e281]: "9"
          - paragraph [ref=f99e282]: Instalé un medidor nuevo y el consumo del cliente subió, ¿a qué se debe?
        - generic [ref=f99e283]:
          - generic [ref=f99e284]: Respuesta
          - paragraph [ref=f99e286]: Esto se debe a la mayor precisión del medidor inteligente, que captura consumos que antes no se registraban correctamente.
      - generic [ref=f99e287]:
        - generic [ref=f99e288]:
          - generic [ref=f99e289]: "10"
          - paragraph [ref=f99e290]: Se rompió la antena del hand-held, ¿qué debo hacer?
        - generic [ref=f99e291]:
          - generic [ref=f99e292]: Respuesta
          - generic [ref=f99e294]:
            - strong [ref=f99e295]: Soporte
            - text: Contacte al soporte técnico. El equipo cuenta con garantía ilimitada.
      - generic [ref=f99e296]:
        - generic [ref=f99e297]:
          - generic [ref=f99e298]: "11"
          - paragraph [ref=f99e299]: El hand-held tiene poca recepción de señal, ¿qué hago?
        - generic [ref=f99e300]:
          - generic [ref=f99e301]: Respuesta
          - generic [ref=f99e303]:
            - strong [ref=f99e304]: Soporte
            - text: Contacte al soporte técnico para evaluar y solucionar el problema de señal.
      - generic [ref=f99e305]:
        - generic [ref=f99e306]:
          - generic [ref=f99e307]: "12"
          - paragraph [ref=f99e308]: ¿Tengo un medidor con manchas en la esfera, a qué se debe y debo retirarlo?
        - generic [ref=f99e309]:
          - generic [ref=f99e310]: Respuesta
          - generic [ref=f99e311]:
            - paragraph [ref=f99e312]: "Las manchas se producen por:"
            - list [ref=f99e313]:
              - listitem [ref=f99e314]: › Minerales presentes en el agua.
              - listitem [ref=f99e315]: › Paso de agua sucia por el sistema.
            - generic [ref=f99e316]:
              - strong [ref=f99e317]: Sin preocupaciones
              - text: No afectan el funcionamiento, por lo que no es necesario retirar el medidor.
