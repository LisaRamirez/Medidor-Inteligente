  - generic [ref=f82e28]:
    - generic [ref=f82e29]: Empresa chilena
    - heading "¿Quiénes Somos?" [level=3] [ref=f82e30]
    - paragraph [ref=f82e32]: Somos una empresa chilena comprometida con revolucionar la gestion del agua potable en comunidades rurales. Nos especializamos en brindar soluciones tecnologicas avanzadas para las APR, ayudandoles a optimizar la distribucion, consumo y monitoreo del agua con la precision y accesibilidad que necesitan.
    - paragraph [ref=f82e33]: Con una vision centrada en la sostenibilidad y el desarrollo comunitario, disenamos productos que no solo facilitan el manejo eficiente del recurso hidrico, sino que tambien garantizan durabilidad, bajo costo operativo y soporte continuo.
    - paragraph [ref=f82e34]:
      - text: Hoy, mas de
      - strong [ref=f82e35]: 200 comunidades
      - text: en Chile confian en nuestra experiencia para modernizar sus sistemas y asegurar un futuro sostenible para su recurso mas esencial.
